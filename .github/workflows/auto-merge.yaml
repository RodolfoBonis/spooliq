name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge minor and patch updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --merge "${{ github.event.pull_request.html_url }}"
          gh pr review --approve "${{ github.event.pull_request.html_url }}"

      - name: Comment on major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.html_url }}" \
            --body "⚠️ **Major version update detected!** This requires manual review due to potential breaking changes."

  backport-auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'backport/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable auto-merge for backport PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "Enabling auto-merge for backport PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --auto --merge

      - name: Auto-approve backport PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          gh pr review "$PR_NUMBER" --approve \
            --body "✅ Auto-approving backport PR. Will merge automatically when all checks pass."

  # NOTE: Release PRs do NOT auto-merge
  # They require explicit manual merge after QA validation in staging
  # This ensures conscious review of production deployments

  cleanup-branches:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Delete merged branch
        if: |
          !contains(github.event.pull_request.head.ref, 'main') &&
          !contains(github.event.pull_request.head.ref, 'develop')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin --delete "${{ github.event.pull_request.head.ref }}" || echo "Branch already deleted or protected"