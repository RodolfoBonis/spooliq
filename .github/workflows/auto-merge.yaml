name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge minor and patch updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --merge "${{ github.event.pull_request.html_url }}"
          gh pr review --approve "${{ github.event.pull_request.html_url }}"

      - name: Comment on major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.html_url }}" \
            --body "⚠️ **Major version update detected!** This requires manual review due to potential breaking changes."

  backport-auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'check_suite' &&
      github.event.check_suite.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and merge backport PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find open backport PRs
          PRS=$(gh pr list --state open --json number,headRefName,mergeable \
            --jq '[.[] | select(.headRefName | startswith("backport/"))]')

          COUNT=$(echo "$PRS" | jq length)
          if [ "$COUNT" -eq 0 ]; then
            echo "No open backport PRs found."
            exit 0
          fi

          echo "$PRS" | jq -c '.[]' | while read -r pr; do
            PR_NUMBER=$(echo "$pr" | jq -r '.number')
            MERGEABLE=$(echo "$pr" | jq -r '.mergeable')

            echo "Checking backport PR #$PR_NUMBER..."

            # Check all non-auto-merge checks passed (exclude self to avoid circular dep)
            ALL_PASSED=$(gh pr checks "$PR_NUMBER" --json state,workflow \
              -q '[.[] | select(.workflow != "Auto-merge") | .state] | all(. == "SUCCESS" or . == "SKIPPED")')

            if [ "$MERGEABLE" == "MERGEABLE" ] && [ "$ALL_PASSED" == "true" ]; then
              echo "All checks passed! Auto-merging PR #$PR_NUMBER..."
              gh pr merge "$PR_NUMBER" --auto --merge
              gh pr review "$PR_NUMBER" --approve \
                --body "✅ Auto-approving backport PR as all checks have passed."
            else
              echo "PR #$PR_NUMBER not ready: mergeable=$MERGEABLE, checks=$ALL_PASSED"
            fi
          done

  # NOTE: Release PRs do NOT auto-merge
  # They require explicit manual merge after QA validation in staging
  # This ensures conscious review of production deployments

  cleanup-branches:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Delete merged branch
        if: |
          !contains(github.event.pull_request.head.ref, 'main') &&
          !contains(github.event.pull_request.head.ref, 'develop')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin --delete "${{ github.event.pull_request.head.ref }}" || echo "Branch already deleted or protected"